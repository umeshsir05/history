<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bhartiya Itihas MCQ Portal</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <i class="fas fa-landmark"></i> <span>इतिहास MCQ</span>
        </div>
        <div class="nav-controls">
            <button id="themeToggle" class="theme-btn" title="Toggle Dark/Light Mode">
                <i class="fas fa-moon"></i>
            </button>
            <button id="hamburgerBtn" class="hamburger-btn" aria-label="Toggle navigation">
                <i class="fas fa-bars"></i>
            </button>
        </div>
        <nav id="navMenu" class="nav-links">
            <a href="#" class="nav-link active" data-category="modern">आधुनिक भारत का इतिहास</a>
            <a href="#" class="nav-link" data-category="ancient">प्राचीन भारत का इतिहास</a>
            <a href="#" class="nav-link" data-category="medieval">मध्य भारत का इतिहास</a>
        </nav>
    </header>

    <main class="container">
        <div class="top-bar">
    <h1 id="sectionTitle">आधुनिक भारत का इतिहास</h1>
    <div class="action-buttons">
        <button id="practiceBtn" class="practice-btn">
            <i class="fas fa-random"></i> 50 Questions Practice Set
        </button>
        <!-- Naya Jump Feature Button & Input Container -->
        <div class="jump-container">
            <input type="number" id="jumpInput" placeholder="Q. No." min="1">
            <button id="jumpBtn" class="jump-btn">
                <i class="fas fa-arrow-right"></i> Jump
            </button>
        </div>
    </div>
</div>


        <div class="stats-info" id="statsInfo">
            कुल प्रश्न: <span id="totalQuestionsCount">0</span>
        </div>

        <div id="quizContainer" class="quiz-container">
            <!-- Questions dynamically injected here -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Bhartiya Itihas Practice Portal. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
